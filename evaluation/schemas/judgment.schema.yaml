$schema: https://json-schema.org/draft/2020-12/schema
$id: https://zhouyaoji.github.io/northstar-docs-frameworks/evaluation/schemas/judgment.schema.yaml
title: Northstar answer-quality judgment
type: object
additionalProperties: false
required: [schemaVersion, runId, responseId, evaluator, rubricVersion, scores, decisions, evaluatedAt]
properties:
  schemaVersion: {const: 2}
  runId: {type: string, minLength: 1}
  responseId: {type: string, minLength: 1}
  evaluator:
    type: object
    additionalProperties: false
    required: [type, identity]
    properties:
      type: {enum: [deterministic, model, human]}
      identity: {type: string, minLength: 1}
      provider: {type: string, minLength: 1}
      model: {type: string, minLength: 1}
      promptVersion: {type: string, minLength: 1}
  rubricVersion: {type: string, minLength: 1}
  scores:
    type: object
    additionalProperties: false
    required: [responseCompletenessHelpfulness, sourceHandling]
    properties:
      responseCompletenessHelpfulness:
        type: object
        additionalProperties: false
        required: [accuracy, completeness, helpfulness, edgeCaseHandling, conflictHandling]
        properties:
          accuracy: {$ref: '#/$defs/score'}
          completeness: {$ref: '#/$defs/score'}
          helpfulness: {$ref: '#/$defs/score'}
          edgeCaseHandling: {$ref: '#/$defs/score'}
          conflictHandling: {$ref: '#/$defs/score'}
      sourceHandling:
        type: object
        additionalProperties: false
        required: [groundedness, sourceCoverage, citationAccuracy, uncertainty]
        properties:
          groundedness: {$ref: '#/$defs/score'}
          sourceCoverage: {$ref: '#/$defs/score'}
          citationAccuracy: {$ref: '#/$defs/score'}
          uncertainty: {$ref: '#/$defs/score'}
  decisions:
    type: object
    additionalProperties: false
    required: [responseCompletenessHelpfulness, sourceHandling]
    properties:
      responseCompletenessHelpfulness: {enum: [pass, needs-review, fail, not_applicable]}
      sourceHandling: {enum: [pass, needs-review, fail, not_applicable]}
  notes: {type: string}
  evidence:
    type: array
    items: {type: string, minLength: 1}
  evaluatedAt: {type: string, format: date-time}
$defs:
  score:
    oneOf:
      - {type: integer, minimum: 0, maximum: 4}
      - {const: not_applicable}

