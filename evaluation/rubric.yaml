schemaVersion: 1
rubricVersion: 1.2.0
name: Northstar documentation quality rubric
principles:
  - Scores measure repeatable conformance to declared criteria, not objective documentation quality.
  - Automated, AI-assisted, and human evidence are reported separately.
  - Criteria without evidence are not included in a numeric score.
methods:
  automated: Deterministic checks that can run in CI.
  ai: Model-assisted judgments that must name the model, prompt, and evidence.
  human: Reviews that identify the role, decision, and date without storing personal data.
scoreGroups:
  content:
    label: Content quality
    scope: shared
    criteria:
      - localization.risky_phrases
      - translation.locale_coverage
      - scope.requirements_approval
      - accuracy.engineering_approval
      - audience.task_success
      - editorial.peer_review
      - translation.linguistic_review
  renderer:
    label: Renderer implementation
    scope: per-renderer
    criteria:
      - structured.expected_pages
      - structured.page_titles
      - accessibility.document_language
      - accessibility.heading_structure
      - accessibility.image_alternatives
      - accessibility.assistive_technology_review
      - seo.page_titles
      - seo.meta_descriptions
      - taxonomy.descriptive_links
      - localization.language_metadata
  ai:
    label: AI readiness
    scope: per-renderer
    criteria:
      - ai.llms_exports
      - ai.assistant_installed
      - ai.retrieval_benchmarks
      - ai.aipp_structured_object
      - ai.aipp_source_provenance
      - ai.aipp_reviewed_sidecars
      - ai.aipp_conflict_signaling
      - ai.aipp_discovery_feed
      - ai.grounded_answers
  publication:
    label: Publication operations
    scope: per-renderer
    criteria:
      - publication.renderer_output
      - release.communications
recommendations:
  structured.expected_pages:
    summary: Include every expected page in the renderer navigation and AI-readable index.
    impact: high
    effort: medium
    feasibility: configurable
    providedBy: northstar-adapter
    fixOwner: documentation-platform
  structured.page_titles:
    summary: Generate a unique, meaningful HTML title for each page.
    impact: medium
    effort: low
    feasibility: configurable
    providedBy: generator
    fixOwner: renderer-config
  accessibility.document_language:
    summary: Configure the generated HTML document language.
    impact: high
    effort: low
    feasibility: configurable
    providedBy: generator
    fixOwner: renderer-config
  accessibility.heading_structure:
    summary: Correct the theme or template so content headings do not skip levels.
    impact: high
    effort: medium
    feasibility: configurable
    providedBy: generator
    fixOwner: renderer-config
  accessibility.image_alternatives:
    summary: Add alt attributes and review informative image descriptions.
    impact: high
    effort: medium
    feasibility: configurable
    providedBy: shared-content
    fixOwner: content-author
  seo.page_titles:
    summary: Supply meaningful page titles through source metadata or renderer configuration.
    impact: high
    effort: low
    feasibility: configurable
    providedBy: generator
    fixOwner: renderer-config
  seo.meta_descriptions:
    summary: Generate a unique meta description for every content page.
    impact: high
    effort: low
    feasibility: configurable
    providedBy: northstar-adapter
    fixOwner: renderer-config
  taxonomy.descriptive_links:
    summary: Replace generic link labels with text that describes the destination.
    impact: medium
    effort: low
    feasibility: native
    providedBy: shared-content
    fixOwner: content-author
  localization.language_metadata:
    summary: Emit a valid BCP 47 language tag on every published page.
    impact: high
    effort: low
    feasibility: configurable
    providedBy: generator
    fixOwner: renderer-config
  localization.risky_phrases:
    summary: Rewrite ambiguous or visual-only phrases in canonical content.
    impact: medium
    effort: low
    feasibility: native
    providedBy: shared-content
    fixOwner: content-author
  ai.llms_exports:
    summary: Generate complete llms.txt and llms-full.txt exports during the build.
    impact: high
    effort: medium
    feasibility: custom
    providedBy: publishing-pipeline
    fixOwner: documentation-platform
  ai.assistant_installed:
    summary: Inject and configure the shared assistant on every non-redirect content page.
    impact: high
    effort: medium
    feasibility: custom
    providedBy: northstar-adapter
    fixOwner: documentation-platform
  ai.retrieval_benchmarks:
    summary: Improve content structure, indexing, or ranking for failed benchmark questions.
    impact: high
    effort: medium
    feasibility: custom
    providedBy: northstar-adapter
    fixOwner: ai-documentation
  ai.aipp_structured_object:
    summary: Publish a valid structured knowledge object containing every canonical section.
    impact: high
    effort: medium
    feasibility: custom
    providedBy: aipp-compiler
    fixOwner: ai-documentation
  ai.aipp_source_provenance:
    summary: Attach registered source references and provenance metadata to every published statement.
    impact: high
    effort: medium
    feasibility: custom
    providedBy: aipp-compiler
    fixOwner: content-operations
  ai.aipp_reviewed_sidecars:
    summary: Add and approve a schema-valid sidecar for every canonical page.
    impact: high
    effort: medium
    feasibility: custom
    providedBy: writer-workflow
    fixOwner: documentation
  ai.aipp_conflict_signaling:
    summary: Preserve unresolved source conflicts as explicit machine-readable statements.
    impact: high
    effort: low
    feasibility: custom
    providedBy: writer-workflow
    fixOwner: documentation
  ai.aipp_discovery_feed:
    summary: Publish discoverable object, schema, provenance, and feed endpoints.
    impact: medium
    effort: low
    feasibility: custom
    providedBy: publishing-pipeline
    fixOwner: documentation-platform
  publication.renderer_output:
    summary: Repair the renderer build or adapter so it produces a complete HTML site.
    impact: high
    effort: high
    feasibility: configurable
    providedBy: publishing-pipeline
    fixOwner: documentation-platform
criteria:
  - id: publication.renderer_output
    category: Publication verification
    method: automated
    weight: 8
    blocking: true
    status: implemented
    description: The renderer produces an HTML site.
  - id: structured.expected_pages
    category: Structured content and markup
    method: automated
    weight: 10
    blocking: true
    status: implemented
    description: Every canonical page is represented in the renderer's AI-readable index.
  - id: structured.page_titles
    category: Structured content and markup
    method: automated
    weight: 6
    blocking: false
    status: implemented
    description: Generated HTML pages have non-empty, unique titles.
  - id: accessibility.document_language
    category: Accessibility
    method: automated
    weight: 6
    blocking: false
    status: implemented
    description: Every HTML page declares a document language.
  - id: accessibility.heading_structure
    category: Accessibility
    method: automated
    weight: 6
    blocking: false
    status: implemented
    description: Content pages contain a first-level heading and do not skip heading levels.
  - id: accessibility.image_alternatives
    category: Accessibility
    method: automated
    weight: 4
    blocking: false
    status: implemented
    description: Content images provide an alt attribute; decorative images may use an empty value.
  - id: seo.page_titles
    category: SEO
    method: automated
    weight: 6
    blocking: false
    status: implemented
    description: Every generated HTML page has a meaningful title.
  - id: seo.meta_descriptions
    category: SEO
    method: automated
    weight: 6
    blocking: false
    status: implemented
    description: Every content page has a non-empty meta description.
  - id: taxonomy.descriptive_links
    category: Taxonomy and findability
    method: automated
    weight: 5
    blocking: false
    status: implemented
    description: Link labels avoid generic phrases such as click here and read more.
  - id: localization.language_metadata
    category: Localization readiness
    method: automated
    weight: 5
    blocking: false
    status: implemented
    description: Published pages declare a valid language tag that localization tooling can discover.
  - id: localization.risky_phrases
    category: Localization readiness
    method: automated
    weight: 5
    blocking: false
    status: implemented
    description: Content avoids selected ambiguous, visual-only, or culturally dependent phrases.
  - id: translation.locale_coverage
    category: Translation quality
    method: automated
    weight: 0
    blocking: false
    status: planned
    description: Every supported locale contains the expected pages and preserves code placeholders.
  - id: ai.llms_exports
    category: AI readiness
    method: automated
    weight: 10
    blocking: true
    status: implemented
    description: llms.txt and llms-full.txt are present and non-empty.
  - id: ai.assistant_installed
    category: AI readiness
    method: automated
    weight: 8
    blocking: true
    status: implemented
    description: The shared documentation assistant is installed on content pages.
  - id: ai.retrieval_benchmarks
    category: AI readiness
    method: automated
    weight: 15
    blocking: false
    status: implemented
    description: The zero-cost assistant retrieves the expected page for fixed benchmark questions.
  - id: ai.aipp_structured_object
    category: AI readiness
    method: automated
    weight: 10
    blocking: true
    status: implemented
    description: The AIPP object represents every canonical document as structured, machine-readable knowledge.
  - id: ai.aipp_source_provenance
    category: AI readiness
    method: automated
    weight: 10
    blocking: true
    status: implemented
    description: Every AIPP statement cites registered sources with provenance metadata.
  - id: ai.aipp_reviewed_sidecars
    category: AI readiness
    method: automated
    weight: 10
    blocking: true
    status: implemented
    description: Every canonical document has a schema-valid sidecar in an approved publication state.
  - id: ai.aipp_conflict_signaling
    category: AI readiness
    method: automated
    weight: 5
    blocking: false
    status: implemented
    description: Conflicting source claims can be preserved as explicitly unresolved statements.
  - id: ai.aipp_discovery_feed
    category: AI readiness
    method: automated
    weight: 5
    blocking: true
    status: implemented
    description: Discovery, feed, schema, object, and provenance artifacts are published together.
  - id: scope.requirements_approval
    category: Scope and requirements
    method: human
    weight: 0
    blocking: false
    status: planned
    description: Product and engineering confirm the documented scope.
  - id: accuracy.engineering_approval
    category: Technical accuracy
    method: human
    weight: 0
    blocking: false
    status: planned
    description: An appropriate engineer verifies claims and procedures.
  - id: audience.task_success
    category: Audience and messaging
    method: human
    weight: 0
    blocking: false
    status: planned
    description: A representative reader can complete the documented task.
  - id: editorial.peer_review
    category: Editorial quality
    method: human
    weight: 0
    blocking: false
    status: planned
    description: A writer other than the author reviews the content.
  - id: accessibility.assistive_technology_review
    category: Accessibility
    method: human
    weight: 0
    blocking: false
    status: planned
    description: Keyboard and screen-reader behavior is reviewed directly.
  - id: translation.linguistic_review
    category: Translation quality
    method: human
    weight: 0
    blocking: false
    status: planned
    description: A qualified speaker reviews meaning, terminology, and cultural suitability.
  - id: ai.grounded_answers
    category: AI readiness
    method: ai
    weight: 0
    blocking: false
    status: planned
    description: Answers are correct, grounded, cited, and appropriately abstain when evidence is missing.
  - id: release.communications
    category: Release communications
    method: human
    weight: 0
    blocking: false
    status: planned
    description: Release notes and lifecycle notices are reviewed when a release requires them.
